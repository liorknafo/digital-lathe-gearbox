; Electronic leadscrew firmware.
;   pio run -e teensy41 -t upload   build + flash the Teensy 4.1
;   pio test -e native              run the motion-core unit tests on the PC

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -Wall
lib_deps =
    https://github.com/mjs513/Teensy-4.x-Quad-Encoder-Library.git
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
